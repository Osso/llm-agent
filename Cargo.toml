[package]
name = "llm-agent"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Agentic loop for OpenAI-compatible LLM APIs with tool execution"
repository = "https://github.com/Osso/llm-agent"

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["process", "io-util", "time", "macros", "rt-multi-thread"] }
reqwest = { version = "0.12", features = ["json"] }
tracing = "0.1"
